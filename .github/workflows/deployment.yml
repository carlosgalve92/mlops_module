# =============================================================================
#  Workflow de CD (Continuous Deployment) para la API
#  ---------------------------------------------------------------------------
#  Construye la imagen Docker, la prueba (smoke test), la publica en
#  Azure Container Registry (ACR) y despliega una nueva revisión en
#  Azure Container Apps (ACA). La autenticación con Azure usa OIDC, de modo
#  que no se almacenan credenciales de larga duración como secretos.
# =============================================================================

name: CD API

# -----------------------------------------------------------------------------
# Disparadores: QUÉ lanza el workflow.
#   - push a master  -> despliegue automático al integrar en la rama principal.
#   - workflow_dispatch -> permite ejecutarlo manualmente desde la pestaña Actions.
# -----------------------------------------------------------------------------
on:
  push:
    branches: [ master ]
    # paths:                 # (opcional) dispara solo si cambian estas rutas
    #   - 'src/**'
  # schedule:                # (opcional) ejecución programada
  #   - cron: '0 6 * * 1'    # lunes a las 06:00 UTC (min hora díaMes mes díaSemana)
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Concurrencia: si llega un push nuevo mientras un despliegue está en curso,
# se cancela el anterior. Evita que dos despliegues de la misma rama se pisen.
# -----------------------------------------------------------------------------
concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# Permisos del GITHUB_TOKEN (mínimo privilegio).
#   - contents: read  -> solo lectura del repo (necesario para el checkout).
#   - id-token: write -> imprescindible para el login OIDC contra Azure.
# -----------------------------------------------------------------------------
permissions:
  contents: read
  id-token: write

# -----------------------------------------------------------------------------
# Variables reutilizables en todo el workflow.
# NOTA: MEMORY "1.0Gi" con CPU "0.5" es una combinación válida en ACA
#       (Consumption): 0.25->0.5Gi, 0.5->1.0Gi, 0.75->1.5Gi, 1.0->2.0Gi...
# -----------------------------------------------------------------------------
env:
  IMAGE_REPO: webinar_imagen
  CPU: "0.5"
  MEMORY: "1.0Gi"
  PORT: "8000"
  MIN_REPLICAS: "1"
  MAX_REPLICAS: "2"

jobs:
  # ===========================================================================
  # JOB 1 · build-test
  # Construye la imagen y la valida en el propio runner (sin publicarla).
  # ===========================================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en el runner. Es el primer paso de
      # casi cualquier workflow: sin él no hay ni Dockerfile ni fuentes.
      - name: Checkout
        uses: actions/checkout@v4

      # Arranca el ssh-agent y carga la clave privada.
      # CORRECCIÓN: se coloca ANTES de instalar dependencias porque 'pip install .'
      # puede tirar de dependencias privadas por git+ssh. Además, esta clave la
      # reutiliza el build de Docker mediante el montaje SSH de BuildKit (ssh: default).
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Instala Poetry ANTES de setup-python, requisito para que 'cache: poetry'
      # (paso siguiente) pueda cachear las dependencias. pipx viene preinstalado.
      - name: Instalar Poetry
        run: pipx install poetry

      # Prepara Python y cachea las dependencias de Poetry usando poetry.lock.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'poetry'

      # Instala el proyecto con Poetry y, con él, la CLI de DVC que se usa después.
      # 'virtualenvs.create false' instala en el Python del runner, de modo que
      # 'dvc' queda directamente en el PATH (sin necesidad de 'poetry run').
      # REQUISITO: 'dvc[azure]' debe estar declarado como dependencia en pyproject.toml.
      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      # Configura las credenciales del remoto DVC SOLO en local (.dvc/config.local,
      # que no se commitea). Ese fichero se inyecta después como secreto en el build
      # para que el Dockerfile pueda hacer 'dvc pull' de los datos/modelos.
      - name: Configurar DVC remoto
        run: |
          dvc remote modify origin --local account_name "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          dvc remote modify origin --local sas_token   "${{ secrets.AZURE_SAS_TOKEN }}"

      # Crea un builder de Buildx con driver docker-container. Necesario para usar
      # montajes SSH/secretos de BuildKit y la caché avanzada. install:true lo deja
      # como builder por defecto.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
          install: true

      # Construye la imagen y la CARGA en el daemon local (load: true) SIN publicarla
      # (push: false), de modo que el siguiente paso pueda arrancarla y probarla.
      - name: Build (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          # platforms: linux/amd64,linux/arm64   # (opcional) build multi-arquitectura
          push: false
          load: true
          tags: ${{ env.IMAGE_REPO }}:test
          # Expone el ssh-agent al build (para 'RUN --mount=type=ssh' en el Dockerfile).
          ssh: |
            default
          # Inyecta las credenciales DVC como secreto de BuildKit (para 'dvc pull').
          secrets: |
            id=dvc_secrets,src=.dvc/config.local

      # Smoke test: arranca el contenedor y comprueba el endpoint de salud.
      # CORRECCIÓN: se usa ${{ env.PORT }} (coherente con la variable) y un bucle de
      # reintentos en vez de un 'sleep 5' fijo, que era frágil si la API tarda en subir.
      - name: Smoke test container
        run: |
          docker run -d -p ${{ env.PORT }}:${{ env.PORT }} --name api ${{ env.IMAGE_REPO }}:test
          for i in $(seq 1 10); do
            if curl -fsS "http://127.0.0.1:${{ env.PORT }}/api/health"; then
              echo "Health OK"; break
            fi
            echo "Esperando a la API... intento $i"
            if [ "$i" -eq 10 ]; then
              echo "La API no respondió a tiempo"; docker logs api; docker rm -f api; exit 1
            fi
            sleep 3
          done
          docker rm -f api

  # ===========================================================================
  # JOB 2 · release
  # Solo se ejecuta si build-test terminó OK (needs) y estamos en master (if).
  # Publica la imagen en ACR y despliega una nueva revisión en ACA.
  # ===========================================================================
  release:
    needs: build-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Igual que en build-test: ssh-agent antes de instalar dependencias.
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'poetry'

      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Configurar DVC remoto
        run: |
          dvc remote modify origin --local account_name "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          dvc remote modify origin --local sas_token   "${{ secrets.AZURE_SAS_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
          install: true

      # Login a Azure mediante OIDC: GitHub emite un token de identidad efímero y
      # Azure lo valida contra una credencial federada. No hay secreto de larga vida.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Autentica el Docker local contra el ACR reutilizando la sesión de az.
      - name: ACR login
        run: az acr login -n "${{ secrets.AZURE_ACR_NAME }}"

      # Obtiene el "login server" del ACR (p. ej. miacr.azurecr.io) y lo expone como
      # output para reutilizarlo en los pasos siguientes.
      # CORRECCIÓN: '$(...)' ya elimina el salto de línea final, así que no hace falta
      # el fichero temporal ni 'tr -d'; el paso queda más simple y robusto.
      - name: Get ACR login server
        id: acr
        run: |
          login_server=$(az acr show -n "${{ secrets.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      # Construye y PUBLICA la imagen final en el ACR, etiquetada con el SHA del commit
      # (gh-<sha>) para trazabilidad. Usa caché remota en el propio ACR para acelerar.
      # CORRECCIÓN: se elimina 'no-cache: true', que era contradictorio con cache-from/
      # cache-to (forzaba build desde cero e ignoraba la caché que sí se exportaba).
      - name: Build & Push to ACR (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          # platforms: linux/amd64,linux/arm64   # (opcional) build multi-arquitectura
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:gh-${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to:   type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache,mode=max
          ssh: |
            default
          secrets: |
            id=dvc_secrets,src=.dvc/config.local

      # Asegura la extensión 'containerapp' de la CLI sin prompts interactivos, que
      # en CI harían fallar el paso siguiente si la extensión no estuviera instalada.
      - name: Preparar Azure CLI (extensión containerapp)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --only-show-errors

      # Despliega la nueva imagen: ACA crea automáticamente una nueva revisión.
      - name: Deploy to ACA (new revision)
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:gh-${{ github.sha }}"
          az containerapp update \
            -g "${{ secrets.AZURE_GROUP }}" \
            -n "${{ secrets.AZURE_ACA_NAME }}" \
            --image "$IMAGE" \
            --cpu "${{ env.CPU }}" \
            --memory "${{ env.MEMORY }}" \
            --min-replicas "${{ env.MIN_REPLICAS }}" \
            --max-replicas "${{ env.MAX_REPLICAS }}"

      # Muestra la URL pública (FQDN del ingress) y la revisión activa, para verificar
      # de un vistazo que el despliegue ha ido bien.
      - name: Show revision & URL
        run: |
          az containerapp show \
            -g "${{ secrets.AZURE_GROUP }}" \
            -n "${{ secrets.AZURE_ACA_NAME }}" \
            --query "{ingress:properties.configuration.ingress.fqdn, revision:properties.latestRevisionName}" -o tsv
