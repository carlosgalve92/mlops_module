# =============================================================================
#  Workflow de CD (Continuous Deployment) para la API
#  ---------------------------------------------------------------------------
#  Construye la imagen Docker, la prueba (smoke test), la publica en
#  Azure Container Registry (ACR) y despliega una nueva revisión en
#  Azure Container Apps (ACA). La autenticación con Azure usa OIDC, de modo
#  que no se almacenan credenciales de larga duración como secretos.
#
#  ENFOQUE SIN VENV (con Poetry):
#  Poetry se instala CON el Python de setup-python ('python -m pip install poetry')
#  en lugar de con pipx. Así, al usar 'virtualenvs.create false', Poetry instala las
#  dependencias en ESE MISMO intérprete, y 'python -m dvc' las encuentra sin ambigüedad.
#  Se conserva el poetry.lock como fuente de versiones (reproducibilidad).
# =============================================================================

name: Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE_REPO: containeregistrymlops
  CPU: "0.5"
  MEMORY: "1.0Gi"
  PORT: "8000"
  MIN_REPLICAS: "1"
  MAX_REPLICAS: "2"

jobs:
  # ===========================================================================
  # JOB 1 · build-test
  # ===========================================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # CORRECCIÓN: caché de pip (ya no gestionamos el entorno con el venv de Poetry,
      # sino instalando en el Python del runner).
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # CORRECCIÓN CLAVE: Poetry instalado CON el Python de setup-python (no con pipx).
      # Esto ata Poetry a ese intérprete, de modo que 'poetry install' con
      # 'virtualenvs.create false' deposita las dependencias EXACTAMENTE donde
      # 'python -m dvc' las va a buscar. Con pipx, Poetry vivía en otro Python
      # y por eso antes salía 'No module named dvc'.
      - name: Instalar Poetry
        run: python -m pip install poetry

      # Sin venv: instala en el Python activo (el del runner). '--sync' deja el
      # entorno idéntico al lock. Se conserva el poetry.lock (reproducibilidad).
      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --sync

      # Verificación temprana: si el lock estuviera desincronizado y no instalara DVC,
      # esto falla rápido y con un mensaje claro en vez de un críptico error después.
      - name: Verificar DVC instalado
        run: |
          python -m dvc --version || {
            echo "::error::DVC no está instalado. Regenera el lock con 'poetry lock' y commitea pyproject.toml + poetry.lock."
            exit 1
          }

      # DVC como módulo del mismo Python del runner (sin 'poetry run', no hay venv).
      - name: Configurar DVC remoto
        run: |
          python -m dvc remote modify origin --local account_name "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          python -m dvc remote modify origin --local sas_token   "${{ secrets.AZURE_SAS_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
          install: true

      - name: Build (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_REPO }}:test
          ssh: |
            default
          secrets: |
            id=dvc_secrets,src=.dvc/config.local

      - name: Smoke test container
        run: |
          docker run -d -p ${{ env.PORT }}:${{ env.PORT }} --name api ${{ env.IMAGE_REPO }}:test
          for i in $(seq 1 10); do
            if curl -fsS "http://127.0.0.1:${{ env.PORT }}/api/health"; then
              echo "Health OK"; break
            fi
            echo "Esperando a la API... intento $i"
            if [ "$i" -eq 10 ]; then
              echo "La API no respondió a tiempo"; docker logs api; docker rm -f api; exit 1
            fi
            sleep 3
          done
          docker rm -f api

  # ===========================================================================
  # JOB 2 · release
  # ===========================================================================
  release:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # CORRECCIÓN CLAVE: Poetry con el Python de setup-python (no pipx).
      - name: Instalar Poetry
        run: python -m pip install poetry

      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --sync

      - name: Verificar DVC instalado
        run: |
          python -m dvc --version || {
            echo "::error::DVC no está instalado. Regenera el lock con 'poetry lock' y commitea pyproject.toml + poetry.lock."
            exit 1
          }

      - name: Configurar DVC remoto
        run: |
          python -m dvc remote modify origin --local account_name "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          python -m dvc remote modify origin --local sas_token   "${{ secrets.AZURE_SAS_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
          install: true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login -n "${{ secrets.AZURE_ACR_NAME }}"

      - name: Get ACR login server
        id: acr
        run: |
          login_server=$(az acr show -n "${{ secrets.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Build & Push to ACR (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:gh-${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to:   type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache,mode=max
          ssh: |
            default
          secrets: |
            id=dvc_secrets,src=.dvc/config.local

      - name: Preparar Azure CLI (extensión containerapp)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy to ACA (new revision)
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:gh-${{ github.sha }}"
          az containerapp update \
            -g "${{ secrets.AZURE_GROUP }}" \
            -n "${{ secrets.AZURE_ACA_NAME }}" \
            --image "$IMAGE" \
            --cpu "${{ env.CPU }}" \
            --memory "${{ env.MEMORY }}" \
            --min-replicas "${{ env.MIN_REPLICAS }}" \
            --max-replicas "${{ env.MAX_REPLICAS }}"

      - name: Show revision & URL
        run: |
          az containerapp show \
            -g "${{ secrets.AZURE_GROUP }}" \
            -n "${{ secrets.AZURE_ACA_NAME }}" \
            --query "{ingress:properties.configuration.ingress.fqdn, revision:properties.latestRevisionName}" -o tsv
