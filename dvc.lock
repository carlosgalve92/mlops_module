          root_dir: artifacts/model_trainer
          steps:
          - name: read_file_train
            params:
              train_file: artifacts/data_transformation/train.csv
              target_column: CREDIT_SCORE
          - name: load_pl_preprocess
            params:
              pl_preprocess_path: 
                artifacts/data_transformation/pl_preprocess.joblib
          - name: create_model
            params:
              model: XGBClassifier
              dict_params:
                objective: binary:logistic
                n_estimators: 128
                max_depth: 8
                random_state: 202508
          - name: build_pipeline
            params: {}
          - name: train
            params:
              model_name: XGBClassifier
              version: 1.0
