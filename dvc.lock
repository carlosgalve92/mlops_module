                      replace_value: Missing
                  - name: mb_woe_encoder
                    params: {}
                prep_num:
                  columns:
                  - MONTHLY_INHAND_SALARY
                  - NUM_BANK_ACCOUNTS
                  - NUM_CREDIT_CARD
                  - INTEREST_RATE
                  - DELAY_FROM_DUE_DATE
                  - NUM_CREDIT_INQUIRIES
                  - CREDIT_UTILIZATION_RATIO
                  - TOTAL_EMI_PER_MONTH
                  steps:
                  - name: mb_simple_imputer
                    params: {}
                  - name: mb_standard_scaler
                    params: {}
                prep_cat_num:
                  columns:
                  - AGE
                  - ANNUAL_INCOME
                  - NUM_OF_LOAN
                  - NUM_OF_DELAYED_PAYMENT
                  - CHANGED_CREDIT_LIMIT
                  - OUTSTANDING_DEBT
                  - AMOUNT_INVESTED_MONTHLY
                  - MONTHLY_BALANCE
                  steps:
                  - name: mb_clean_text_number
                    params: {}
